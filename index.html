<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#25395b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Sudoku Pocket</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#26344a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:510px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:25px;margin:8px 0 12px}button,select{font:inherit;border:1px solid #cbd4e2;border-radius:10px;background:white;color:#25395b;padding:11px;cursor:pointer}button:disabled{opacity:.35}.primary{background:#25395b;color:white}.bar,.actions,.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.bar select{flex:1}.status{font-size:13px;color:#53627b;min-height:20px}.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));border:3px solid #26344a;background:white;aspect-ratio:1}.cell{min-width:0;padding:0;border:0;border-right:1px solid #c9d2df;border-bottom:1px solid #c9d2df;border-radius:0;display:flex;justify-content:center;align-items:center;font-weight:500;font-size:clamp(16px,5vw,25px);background:white;position:relative}.cell:nth-child(9n+3),.cell:nth-child(9n+6){border-right:3px solid #26344a}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid #26344a}.cell.given{font-weight:800;color:#26344a;background:#f1f4f9}.cell.user{color:#1c68aa}.cell.selected{background:#cce5ff}.cell.peer:not(.selected){background:#eaf3fc}.cell.bad{background:#ffd9dc;color:#a11c30}.notes{font-size:9px;letter-spacing:1px;line-height:1.15;overflow-wrap:anywhere}.numbers{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:14px 0}.numbers button{padding:10px 0;font-weight:700;font-size:19px}.tools button{flex:1}.actions button{flex:1}footer{font-size:12px;color:#66738a;margin-top:16px}#install{display:none}
</style></head><body><main class="app"><header><h1>🧩 Sudoku Pocket</h1><button id="install">Installa</button></header><div class="bar"><label for="level">Livello</label><select id="level"><option value="easy">Facile</option><option value="medium">Medio</option><option value="hard">Difficile</option></select><button id="new">Nuova partita</button></div><p class="status" id="status" aria-live="polite"></p><div class="board" id="board" role="grid" aria-label="Sudoku 9 per 9"></div><div class="numbers" id="numbers"></div><div class="tools"><button id="pencil">✎ Matita: OFF</button><button id="erase">⌫ Cancella</button><button id="undo">↶ Annulla</button></div><div class="actions"><button class="primary" id="check">Controlla</button><button id="reset">Ricomincia</button></div><footer>Gli errori non vengono mostrati mentre giochi. La partita viene salvata automaticamente su questo dispositivo. Funziona offline dopo la prima apertura online.</footer></main><script>
const $=id=>document.getElementById(id),base=[5,3,4,6,7,8,9,1,2,6,7,2,1,9,5,3,4,8,1,9,8,3,4,2,5,6,7,8,5,9,7,6,1,4,2,3,4,2,6,8,5,3,7,9,1,7,1,3,9,2,4,8,5,6,9,6,1,5,3,7,2,8,4,2,8,7,4,1,9,6,3,5,3,4,5,2,8,6,1,7,9];
const count={easy:39,medium:31,hard:25};let game,selected=0,pencil=false,checked=false,history=[],installPrompt=null;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function generate(level){let digits=shuffle([1,2,3,4,5,6,7,8,9]);let bands=shuffle([0,1,2]),stacks=shuffle([0,1,2]);let rows=bands.flatMap(b=>shuffle([0,1,2]).map(x=>b*3+x));let cols=stacks.flatMap(b=>shuffle([0,1,2]).map(x=>b*3+x));let solution=rows.flatMap(r=>cols.map(c=>digits[base[r*9+c]-1]));let puzzle=[...solution];let order=shuffle(Array.from({length:81},(_,i)=>i));for(let i=0;i<81-count[level];i++)puzzle[order[i]]=0;return {level,solution,puzzle,values:[...puzzle],notes:{}}}
function save(){localStorage.setItem('sudoku-pocket-v1',JSON.stringify(game))}function restore(){try{let g=JSON.parse(localStorage.getItem('sudoku-pocket-v1'));if(g&&g.values?.length===81&&g.puzzle?.length===81&&g.solution?.length===81)return g}catch{}return null}
function conflicts(){let bad=new Set();for(let i=0;i<81;i++){if(!game.values[i])continue;for(let j=i+1;j<81;j++)if(game.values[i]===game.values[j]&&(Math.floor(i/9)===Math.floor(j/9)||i%9===j%9||(Math.floor(i/27)===Math.floor(j/27)&&Math.floor(i%9/3)===Math.floor(j%9/3)))){bad.add(i);bad.add(j)}}return bad}
function render(){let bad=checked?conflicts():new Set(),board=$('board');board.replaceChildren();for(let i=0;i<81;i++){let b=document.createElement('button');b.className='cell'+(game.puzzle[i]?' given':game.values[i]?' user':'')+(selected===i?' selected':(Math.floor(i/9)===Math.floor(selected/9)||i%9===selected%9||Math.floor(i/27)===Math.floor(selected/27)&&Math.floor(i%9/3)===Math.floor(selected%9/3))?' peer':'')+(bad.has(i)?' bad':'');b.setAttribute('aria-label',`Riga ${Math.floor(i/9)+1}, colonna ${i%9+1}, ${game.values[i]||'vuota'}`);if(game.values[i])b.textContent=game.values[i];else if(game.notes[i]?.length){let s=document.createElement('span');s.className='notes';s.textContent=game.notes[i].join(' ');b.append(s)}b.onclick=()=>{selected=i;render()};board.append(b)}$('level').value=game.level;$('pencil').textContent='✎ Matita: '+(pencil?'ON':'OFF');$('status').textContent=checked?(bad.size?`${bad.size} caselle in conflitto evidenziate.`:game.values.every(Boolean)?'Complimenti! Sudoku valido 🎉':'Nessuna ripetizione. Continua!'):`${game.values.filter(Boolean).length} di 81 caselle compilate`;}
function edit(n){if(game.puzzle[selected])return;history.push(JSON.stringify({values:game.values,notes:game.notes}));if(history.length>100)history.shift();if(pencil&&n){let a=game.notes[selected]||[];game.notes[selected]=a.includes(n)?a.filter(x=>x!==n):[...a,n].sort()}else{game.values[selected]=n;delete game.notes[selected]}checked=false;save();render()}
for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>edit(n);$('numbers').append(b)}$('erase').onclick=()=>edit(0);$('pencil').onclick=()=>{pencil=!pencil;render()};$('check').onclick=()=>{checked=true;render()};$('undo').onclick=()=>{if(!history.length)return;let prev=JSON.parse(history.pop());game.values=prev.values;game.notes=prev.notes;checked=false;save();render()};$('reset').onclick=()=>{if(confirm('Vuoi cancellare i numeri inseriti in questa partita?')){game.values=[...game.puzzle];game.notes={};history=[];checked=false;save();render()}};$('new').onclick=()=>{if(confirm('Vuoi iniziare una nuova partita? La partita attuale sarà sostituita.')){game=generate($('level').value);history=[];checked=false;save();render()}};$('level').onchange=()=>{$('status').textContent='Premi Nuova partita per usare questo livello.'};game=restore()||generate('easy');save();render();window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').style.display='inline-block'});$('install').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('install').style.display='none'}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
